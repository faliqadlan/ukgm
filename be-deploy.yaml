apiVersion: apps/v1
kind: Deployment
metadata:
      name: ukgm-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: go-app
    spec:
      volumes: 
      - name: token-firebase
        configMap:
          name: token-firebase
      containers:
        - image: faliqadlan/ukgm-api:latest
          name: go-app
          volumeMounts:
          - name: token-firebase
            mountPath: ./app/internal/pkg/token/firebase
          env:
            - name: "PORT"
              value: "8000"
            - name: "WEB_API_KEY"
              valueFrom:
                secretKeyRef:
                  key: WEB_API_KEY
                  name: go-app-secret
            - name: "DB_CONNECTION"
              valueFrom:
                secretKeyRef:
                  key: DB_CONNECTION
                  name: go-app-secret
            - name: "DB_HOST"
              valueFrom:
                secretKeyRef:
                  key: DB_HOST
                  name: go-app-secret
            - name: "DB_PORT"
              valueFrom:
                secretKeyRef:
                  key: DB_PORT
                  name: go-app-secret
            - name: "DB_DATABASE"
              valueFrom:
                secretKeyRef:
                  key: DB_DATABASE
                  name: go-app-secret
            - name: "DB_USERNAME"
              valueFrom:
                secretKeyRef:
                  key: DB_USERNAME
                  name: go-app-secret
            - name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: go-app-secret
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: go-app-service
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8000
  selector:
    app: go-app
---
apiVersion:  networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-app-ingress
  annotations:
    dev.okteto.com/generate-host: "domain"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-app-service
            port: 
              number: 8080
        